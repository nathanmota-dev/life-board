name: PR Validation

on:
  workflow_run:
    workflows: ["Frontend CI", "Rust CI", "Electron E2E", "PR Quality Gate", "Performance"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: pr-validation-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile PR Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reporter helpers
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile latest workflow attempts
        uses: actions/github-script@v7
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_ACTION: ${{ github.event.action }}
        with:
          script: |
            const {
              WORKFLOWS,
              aggregateState,
              classifyWorkflow,
              findProtectedChanges,
              isApprovedInfrastructureChange,
              missingRunsShouldBlock,
              renderReport,
              selectLatestRun,
              selectWorkflows,
            } = require('./scripts/pr-validation.js')

            const sha = process.env.EVENT_SHA
            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner: context.repo.owner, repo: context.repo.repo, commit_sha: sha, per_page: 100 },
            )
            const eventPullRequests = context.payload.workflow_run?.pull_requests ?? []
            const pullRequest = [...associated, ...eventPullRequests]
              .find((candidate) => candidate.state !== 'closed' && candidate.head?.sha === sha)
            if (!pullRequest) {
              core.info(`No open PR currently points at ${sha}; ignoring stale workflow event.`)
              return
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            })
            // Read from the default-branch checkout, so a pull request cannot shrink its own list.
            const protectedPathPolicy = require('./scripts/protected-paths.json')
            let policyEstablished = true
            try {
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/workflows/pr-validation.yml',
                ref: pullRequest.base.sha,
              })
            } catch (error) {
              if (error.status === 404) policyEstablished = false
              else throw error
            }
            const protectedChanges = policyEstablished
              ? findProtectedChanges(files.flatMap((file) => [file.filename, file.previous_filename]), protectedPathPolicy)
              : []
            const selection = selectWorkflows(files.map((file) => file.filename))
            const workflowCatalog = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const runsByWorkflow = new Map()
            for (const workflow of WORKFLOWS) {
              const definition = workflowCatalog.find((candidate) => candidate.name === workflow.name)
              if (!definition) {
                runsByWorkflow.set(workflow.name, null)
                continue
              }
              const listed = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: definition.id,
                event: 'pull_request',
                head_sha: sha,
                per_page: 100,
              })
              const runs = listed.map((run) => ({
                ...run,
                pull_requests: run.pull_requests?.length
                  ? run.pull_requests
                  : [{ number: pullRequest.number, head: { sha: run.head_sha } }],
              }))
              runsByWorkflow.set(workflow.name, selectLatestRun(runs, pullRequest.number, sha))
            }

            const checks = []
            const selectedWorkflowNames = WORKFLOWS
              .filter((workflow) => selection[workflow.name] === true)
              .map((workflow) => workflow.name)
            for (const workflow of WORKFLOWS) {
              const selected = selection[workflow.name] === true
              const run = runsByWorkflow.get(workflow.name)
              const missingExpired = missingRunsShouldBlock({
                eventAction: process.env.EVENT_ACTION,
                runsByWorkflow,
                selectedWorkflowNames,
              })
              const classified = classifyWorkflow({ selected, run, missingExpired })
              checks.push({
                workflow: workflow.name,
                check: workflow.check,
                selected,
                ...classified,
                run,
              })
            }
            const infrastructureApproved = isApprovedInfrastructureChange({
              labels: (pullRequest.labels ?? []).map((label) => label.name),
              headBranch: pullRequest.head?.ref ?? '',
              headRepository: pullRequest.head?.repo?.full_name ?? '',
              repository: `${context.repo.owner}/${context.repo.repo}`,
            })
            const blockedProtectedChanges = infrastructureApproved ? [] : protectedChanges
            const state = blockedProtectedChanges.length > 0 ? 'failure' : aggregateState(checks)
            const statusDescription = state === 'success'
              ? 'All selected workflows passed'
              : state === 'pending'
                ? 'Selected workflows are still running'
                : 'A selected workflow failed, was cancelled, timed out, or is missing'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'PR Validation',
              description: statusDescription,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

            const links = checks.map((check) => {
              const url = check.run?.html_url
              return url ? `[${check.workflow}](${url})` : `${check.workflow}: no run link`
            })

            // The gate JSON comes from a pull-request artifact: it is parsed as data
            // and every value is escaped by the renderer, never executed.
            const { execFileSync } = require('node:child_process')
            const fs = require('node:fs')
            const os = require('node:os')
            const path = require('node:path')
            async function readGateReport(workflowName, artifactPrefix, reportPath) {
              const run = runsByWorkflow.get(workflowName)
              if (!run || run.status !== 'completed') return null
              try {
                const artifactName = `${artifactPrefix}-${pullRequest.number}-${run.id}-${run.run_attempt ?? 1}`
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                })
                const artifact = artifacts.find((candidate) => candidate.name === artifactName && !candidate.expired)
                if (!artifact) return { status: 'error', error: `artifact ${artifactName} was not found` }
                const { data } = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                })
                const zipPath = path.join(fs.mkdtempSync(path.join(os.tmpdir(), 'gate-report-')), 'artifact.zip')
                fs.writeFileSync(zipPath, Buffer.from(data))
                const json = execFileSync('unzip', ['-p', zipPath, reportPath], { maxBuffer: 5 * 1024 * 1024 })
                return JSON.parse(json.toString('utf8'))
              } catch (error) {
                core.warning(`${workflowName} report could not be read: ${error.message}`)
                return { status: 'error', error: `${reportPath} could not be read from the ${workflowName} artifact` }
              }
            }
            const quality = await readGateReport('PR Quality Gate', 'quality-gate-pr', 'reports/quality-gate.json')
            const performance = await readGateReport('Performance', 'performance-pr', 'reports/performance.json')

            const body = renderReport({
              quality,
              performance,
              checks,
              state,
              sha,
              pullRequestNumber: pullRequest.number,
              details: [
                `Run details: ${links.join(' · ')}`,
                'High-severity npm audits remain warning-only and do not block this validation.',
                ...(protectedChanges.length > 0
                  ? [`Protected validation paths changed${infrastructureApproved ? ' (approved)' : ''}: ${protectedChanges.join(', ')}`]
                  : []),
              ],
            })
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            })
            const marker = '<!-- life-board-pr-report -->'
            const reportComments = comments.filter((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker))
            const existing = reportComments[0]
            for (const duplicate of reportComments.slice(1)) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: duplicate.id,
              })
            }
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pullRequest.number, body })
            }
