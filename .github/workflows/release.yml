# Tag-driven Linux release: one commit, one build, one reviewed draft and
# one publication after maintainer approval. See docs/releases.md for the procedure,
# the approval gate and the rerun/immutability policy.
name: Release

on:
  push:
    tags: ["v*"]
  # Build/validate only, on any branch or tag: no draft, release or feed change.
  # The mode comes from the event, never from an input.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.18.0

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.mode.outputs.release }}
      release-tag: ${{ steps.mode.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts

      # Only a tag push can release; the tag must be stable, match package.json and have notes.
      - name: Select release or build-only mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            node desktop/scripts/release-checks.mts tag "$GITHUB_REF_NAME"
            test -s "docs/release-notes/${GITHUB_REF_NAME#v}.md" || { echo "::error::Missing docs/release-notes/${GITHUB_REF_NAME#v}.md"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "release-tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "release-tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "Mode: $([ "$EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ] && echo "release $GITHUB_REF_NAME" || echo build-only); source $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Public distribution currently supports Linux only.
  linux:
    name: Linux
    needs: validate
    uses: ./.github/workflows/build-linux.yml
    with:
      release: ${{ needs.validate.outputs.release == 'true' }}

  # Verify only artifacts from the Linux build of this run.
  verify:
    name: Verify complete release assets
    needs: [validate, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Check the Linux build version, commit and tag
        env:
          BUILDS: ${{ toJSON(needs) }}
        run: node desktop/scripts/release-checks.mts builds linux

      # Artifacts of this run only, one directory per target.
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-x64
          path: artifacts

      - name: Compose and verify the upload directory
        run: |
          node desktop/scripts/release-checks.mts compose artifacts release linux
          node desktop/scripts/release-checks.mts assets release linux
          {
            echo "### Release assets ($([ -n "$RELEASE_TAG" ] && echo "$RELEASE_TAG" || echo build-only))"
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 14
          path: release/

  draft:
    name: Stage draft release
    needs: [validate, verify]
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate.outputs.release-tag }}
      RELEASE_TAG: ${{ needs.validate.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-x64
          path: artifacts

      # Recomposes from the builds and revalidates provenance against the tag checkout.
      - name: Verify the builds before staging
        run: node desktop/scripts/release-checks.mts compose artifacts release linux

      - name: Create or reuse the draft
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          action=$(node desktop/scripts/release-checks.mts draft-action "$TAG" "$state")
          notes="docs/release-notes/${TAG#v}.md"
          if [ "$action" = create ]; then
            gh release create "$TAG" --draft --verify-tag --title "Life Board ${TAG#v}" --notes-file "$notes"
          else
            gh release edit "$TAG" --notes-file "$notes"
            # A rerun replaces everything from the failed attempt with this run's assets.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              gh release delete-asset "$TAG" "$name" --yes
            done
          fi
          gh release upload "$TAG" release/*

      - name: Verify the draft byte for byte
        run: |
          gh release view "$TAG" --json assets > assets.json
          node desktop/scripts/release-checks.mts uploaded release assets.json linux
          gh release download "$TAG" --dir draft
          diff -r release draft
          {
            echo "### Draft $TAG is ready for review"
            echo "Download and test the installers from the draft, then approve or reject the **release** environment."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish after maintainer approval
    needs: [validate, draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The only job with this environment; its required reviewers are the approval gate.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate.outputs.release-tag }}
      RELEASE_TAG: ${{ needs.validate.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-x64
          path: artifacts

      # Nothing is rebuilt: the draft must still hold exactly the verified bytes.
      - name: Publish the verified draft
        run: |
          node desktop/scripts/release-checks.mts compose artifacts release linux
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo "::error::$TAG is not a draft"; exit 1; }
          gh release view "$TAG" --json assets > assets.json
          node desktop/scripts/release-checks.mts uploaded release assets.json linux
          gh release download "$TAG" --dir draft
          diff -r release draft
          gh release edit "$TAG" --draft=false --latest

      # curl sends no credentials, so this is what end users and the updaters receive.
      - name: Verify public downloads and feeds without a token
        run: |
          base="https://github.com/${GH_REPO}/releases"
          mkdir public
          for name in $(cd release && ls); do
            curl -fsSL --retry 5 --retry-delay 10 "$base/download/${TAG}/$name" -o "public/$name" \
              || { echo "::error::$name is not publicly downloadable"; exit 1; }
          done
          diff -r release public || { echo "::error::Public assets differ from the verified build"; exit 1; }
          node desktop/scripts/release-checks.mts assets public linux
          for feed in latest-linux.yml; do
            curl -fsSL --retry 5 --retry-delay 10 "$base/latest/download/$feed" | cmp - "release/$feed" \
              || { echo "::error::The stable $feed does not serve $TAG"; exit 1; }
          done
