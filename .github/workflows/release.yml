# Tag-driven Linux x64 release. See docs/releases.md for the procedure,
# the smoke-test gate and the rerun/immutability policy.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs check and package only; they never create a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.18.0

jobs:
  build:
    name: Check and package Linux
    uses: ./.github/workflows/build-linux.yml
    with:
      release: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

  draft:
    name: Stage draft release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release

      - name: Verify downloaded build before staging
        run: node desktop/scripts/release-checks.mts assets release linux-x64

      - name: Create or reuse the draft
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            echo "::error::$TAG is already published. Its binaries are immutable; release a new patch version."
            exit 1
          fi
          notes="docs/release-notes/${TAG#v}.md"
          if [ "$state" = missing ]; then
            gh release create "$TAG" --draft --verify-tag --title "Life Board ${TAG#v}" --notes-file "$notes"
          else
            gh release edit "$TAG" --notes-file "$notes"
            # A rerun replaces everything from the failed attempt with this build's assets.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              gh release delete-asset "$TAG" "$name" --yes
            done
          fi
          gh release upload "$TAG" release/*

      - name: Verify draft assets
        run: |
          gh release view "$TAG" --json assets > assets.json
          node desktop/scripts/release-checks.mts uploaded release assets.json linux-x64

  publish:
    name: Publish after smoke-test approval
    needs: [build, draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required reviewers on this environment; approval is the manual smoke-test gate.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release

      - name: Publish the verified draft
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release view "$TAG" --json assets > assets.json
          node desktop/scripts/release-checks.mts uploaded release assets.json linux-x64
          gh release edit "$TAG" --draft=false --latest

      # curl sends no credentials, so this is what end users and the updater receive.
      - name: Verify public downloads without a token
        run: |
          base="https://github.com/${GH_REPO}/releases/download/${TAG}"
          for name in $(cd release && ls); do
            curl -fsSL --retry 5 --retry-delay 10 "$base/$name" -o "public-$name"
            cmp "public-$name" "release/$name"
          done
          curl -fsSL "https://github.com/${GH_REPO}/releases/latest/download/latest-linux.yml" | cmp - release/latest-linux.yml
