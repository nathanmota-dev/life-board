# Tag-driven Linux x64 release. See docs/releases.md for the procedure,
# the smoke-test gate and the rerun/immutability policy.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs check and package only; they never create a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.18.0

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate tag
        if: github.ref_type == 'tag'
        run: node desktop/scripts/release-checks.mts tag "$GITHUB_REF_NAME"

      - name: Require release notes
        if: github.ref_type == 'tag'
        run: test -s "docs/release-notes/${GITHUB_REF_NAME#v}.md"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage

      - name: Package DEB and AppImage
        run: npm run package:linux

      - name: Write checksums
        working-directory: release
        run: sha256sum life-board_*_amd64.deb life-board-*-x86_64.AppImage latest-linux.yml > SHA256SUMS.txt

      - name: Verify feed and checksums
        run: node desktop/scripts/release-checks.mts assets release

      - name: Inspect DEB
        run: |
          deb=$(ls release/life-board_*_amd64.deb)
          dpkg-deb --info "$deb"
          test "$(dpkg-deb --field "$deb" Package Version Architecture)" = "$(printf 'Package: life-board\nVersion: %s\nArchitecture: amd64' "$(node -p 'require("./package.json").version')")"
          contents=$(dpkg-deb --contents "$deb")
          for path in "./opt/Life Board/life-board-app" "./opt/Life Board/resources/app.asar" \
            "./opt/Life Board/resources/app-update.yml" "./opt/Life Board/resources/package-type" \
            "./opt/Life Board/resources/migrations/meta/_journal.json" \
            ./usr/share/applications/life-board-app.desktop ./usr/share/icons/hicolor/1024x1024/apps/life-board-app.png; do
            grep -qF " $path" <<<"$contents" || { echo "::error::Missing $path"; exit 1; }
          done

      - name: Install DEB and smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y ./release/life-board_*_amd64.deb desktop-file-utils xvfb xauth gnome-keyring dbus-x11
          desktop-file-validate /usr/share/applications/life-board-app.desktop
          desktop/scripts/smoke-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/life-board_*_amd64.deb
            release/life-board-*-x86_64.AppImage
            release/latest-linux.yml
            release/SHA256SUMS.txt

  draft:
    name: Stage draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release

      - name: Create or reuse the draft
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            echo "::error::$TAG is already published. Its binaries are immutable; release a new patch version."
            exit 1
          fi
          notes="docs/release-notes/${TAG#v}.md"
          if [ "$state" = missing ]; then
            gh release create "$TAG" --draft --verify-tag --title "Life Board ${TAG#v}" --notes-file "$notes"
          else
            gh release edit "$TAG" --notes-file "$notes"
            # A rerun replaces everything from the failed attempt with this build's assets.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              gh release delete-asset "$TAG" "$name" --yes
            done
          fi
          gh release upload "$TAG" release/*

      - name: Verify draft assets
        run: |
          gh release view "$TAG" --json assets > assets.json
          node desktop/scripts/release-checks.mts uploaded release assets.json

  publish:
    name: Publish after smoke-test approval
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required reviewers on this environment; approval is the manual smoke-test gate.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release

      - name: Publish the verified draft
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release view "$TAG" --json assets > assets.json
          node desktop/scripts/release-checks.mts uploaded release assets.json
          gh release edit "$TAG" --draft=false --latest

      # curl sends no credentials, so this is what end users and the updater receive.
      - name: Verify public downloads without a token
        run: |
          base="https://github.com/${GH_REPO}/releases/download/${TAG}"
          for name in $(cd release && ls); do
            curl -fsSL --retry 5 --retry-delay 10 "$base/$name" -o "public-$name"
            cmp "public-$name" "release/$name"
          done
          curl -fsSL "https://github.com/${GH_REPO}/releases/latest/download/latest-linux.yml" | cmp - release/latest-linux.yml
