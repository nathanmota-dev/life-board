# Read-only native macOS x64/arm64 builds. Developer ID and notary secrets are
# scoped to trusted tag packaging; every other run is ad-hoc build-only.
name: Build macOS

on:
  workflow_call:
    inputs:
      release:
        description: Require a stable tag, notes and notarized Developer ID signatures
        type: boolean
        required: false
        default: false
    secrets:
      MAC_CSC_LINK:
        description: Base64-encoded Developer ID Application .p12 (trusted release calls only)
        required: false
      MAC_CSC_KEY_PASSWORD:
        description: .p12 password
        required: false
      APPLE_API_KEY_P8:
        description: App Store Connect API key (.p8 contents) for notarytool
        required: false
      APPLE_API_KEY_ID:
        description: App Store Connect API key ID
        required: false
      APPLE_API_ISSUER:
        description: App Store Connect issuer ID
        required: false
    outputs:
      artifact-names:
        description: JSON array of the validated artifacts, one per architecture
        value: ${{ jobs.verify.outputs.artifact-names }}
      version:
        value: ${{ jobs.verify.outputs.version }}
      source-sha:
        value: ${{ jobs.verify.outputs.source-sha }}
      release-tag:
        value: ${{ jobs.verify.outputs.release-tag }}
      signing-status:
        description: signed (Developer ID, notarized) or adhoc (build-only)
        value: ${{ jobs.verify.outputs.signing-status }}
  workflow_dispatch:
  # Allows validating this workflow before dispatch is registered on main.
  push:
    branches: ['ci/**']
    paths:
      - .github/workflows/build-macos.yml
      - desktop/**
      - api/**
      - web/**
      - package*.json
      - tsconfig*.json
      - electron.vite.config.mts

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  RELEASE_TAG: ${{ inputs.release && github.event_name != 'workflow_dispatch' && github.ref_type == 'tag' && github.ref_name || '' }}
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Check, install and smoke macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel is the last x86_64 image; the plain label is Apple Silicon.
          - { target: macos-x64, arch: x64, machine: x86_64, runner: macos-15-intel }
          - { target: macos-arm64, arch: arm64, machine: arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      OUT: release/mac-${{ matrix.arch }}
      DIAGNOSTICS: test-results/${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Record what the runner really is; an alias or Rosetta is not proof.
      - name: Verify toolchain and record native runner
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          node -e 'if (process.versions.node !== "24.18.0" || process.platform !== "darwin" || process.arch !== process.env.ARCH) process.exit(1)'
          test "$(uname -m)" = "$MACHINE"
          test "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = 0
          test "$(sw_vers -productVersion | cut -d . -f 1)" = 15
          sw_vers
          echo "$TARGET: $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(uname -m), $(sysctl -n machdep.cpu.brand_string); image $ImageOS $ImageVersion; Node $(node --version); Xcode $(xcodebuild -version | head -n 1); source $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate smoke syntax with the system bash 3.2
        run: /bin/bash -n desktop/scripts/smoke-macos.sh

      - name: Validate trusted release request
        if: inputs.release && github.event_name != 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != push ] || [ "$GITHUB_REF_TYPE" != tag ] || [ "$REPOSITORY" != nathanmota-dev/life-board ]; then
            echo "::error::Release signing requires a trusted repository tag push"
            exit 1
          fi

      - run: npm ci
      - name: Validate stable tag and notes
        if: env.RELEASE_TAG != ''
        run: |
          node desktop/scripts/release-checks.mts tag "$RELEASE_TAG"
          test -s "docs/release-notes/${RELEASE_TAG#v}.md"
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage

      # Ad-hoc signing with the hardened runtime, without any credential. Only
      # electron-builder's pull-request guard is lifted so it never goes unsigned.
      - name: Package ad-hoc build-only DMG and ZIP
        if: env.RELEASE_TAG == ''
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: >-
          npm run "package:mac:$ARCH" --
          --config.mac.identity=-
          --config.mac.entitlements=desktop/resources/entitlements.mac.adhoc.plist
          --config.mac.entitlementsInherit=desktop/resources/entitlements.mac.adhoc.plist

      - name: Package, sign and notarize production DMG and ZIP
        if: env.RELEASE_TAG != ''
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER EXPECTED_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Production signing requires $name"; exit 1; fi
          done
          mkdir -p "$DIAGNOSTICS"
          secrets=$(mktemp -d "$RUNNER_TEMP/macos-signing.XXXXXX")
          keychain="$secrets/signing.keychain-db"
          password=$(uuidgen)
          original=()
          while IFS= read -r line; do
            line=${line#"${line%%[![:space:]]*}"}
            line=${line#\"}
            original+=("${line%\"}")
          done < <(security list-keychains -d user)
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            security list-keychains -d user -s "${original[@]}"
            rm -rf "$secrets"
          }
          trap cleanup EXIT
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$secrets/developer-id.p12"
          security import "$secrets/developer-id.p12" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "${original[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -F "Developer ID Application: " | grep -F "($EXPECTED_TEAM_ID)" | awk '{ print $2; exit }')
          if [ -z "$identity" ]; then echo "::error::The certificate is not a valid Developer ID Application identity of team $EXPECTED_TEAM_ID"; exit 1; fi
          export APPLE_API_KEY="$secrets/AuthKey_$APPLE_API_KEY_ID.p8"
          (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY")
          unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8
          # Signs the app, helpers and libSQL with the hardened runtime, then
          # notarizes and staples the app before the DMG and ZIP are made.
          npm run "package:mac:$ARCH" -- --config.forceCodeSigning=true "--config.mac.identity=$identity"
          dmg="$OUT/life-board-$(node -p 'require("./package.json").version')-mac-$ARCH.dmg"
          codesign --sign "$identity" --keychain "$keychain" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m --output-format json > "$DIAGNOSTICS/notary-dmg.json" || true
          cat "$DIAGNOSTICS/notary-dmg.json"
          submission=$(node -p 'require(process.argv[1]).id ?? ""' "$PWD/$DIAGNOSTICS/notary-dmg.json" 2>/dev/null || true)
          if [ "$(node -p 'require(process.argv[1]).status' "$PWD/$DIAGNOSTICS/notary-dmg.json" 2>/dev/null)" != Accepted ]; then
            if [ -n "$submission" ]; then
              xcrun notarytool log "$submission" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" "$DIAGNOSTICS/notary-dmg-log.json" || true
            fi
            echo "::error::Apple did not accept the DMG for notarization"
            exit 1
          fi
          xcrun stapler staple "$dmg"

      - name: Install from the DMG and smoke natively
        env:
          EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          version=$(node -p 'require("./package.json").version')
          production=()
          if [ -n "$RELEASE_TAG" ]; then production=(--team-id "$EXPECTED_TEAM_ID"); fi
          /bin/bash desktop/scripts/smoke-macos.sh "$OUT/life-board-$version-mac-$ARCH.dmg" --evidence "$DIAGNOSTICS" "${production[@]}"
          cp "$DIAGNOSTICS/signing-info.json" "$OUT/signing-info.json"

      - name: Write provenance and checksums
        id: provenance
        run: |
          node desktop/scripts/release-checks.mts build-info "$OUT" "$TARGET"
          version=$(node -p 'require(process.argv[1]).version' "$PWD/$OUT/build-info.json")
          status=$(node -p 'require(process.argv[1]).status' "$PWD/$OUT/signing-info.json")
          (cd "$OUT" && shasum -a 256 "life-board-$version-mac-$ARCH.zip" "life-board-$version-mac-$ARCH.dmg" \
            "life-board-$version-mac-$ARCH.zip.blockmap" latest-mac.yml build-info.json signing-info.json > SHA256SUMS.txt)
          echo "$TARGET: **$status**; release tag: '$RELEASE_TAG'. Ad-hoc branch artifacts are for validation only." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify feed, blockmap, signing evidence and provenance
        run: node desktop/scripts/release-checks.mts assets "$OUT" "$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.OUT }}/life-board-*-mac-${{ matrix.arch }}.dmg
            ${{ env.OUT }}/life-board-*-mac-${{ matrix.arch }}.zip
            ${{ env.OUT }}/life-board-*-mac-${{ matrix.arch }}.zip.blockmap
            ${{ env.OUT }}/latest-mac.yml
            ${{ env.OUT }}/build-info.json
            ${{ env.OUT }}/signing-info.json
            ${{ env.OUT }}/SHA256SUMS.txt
      - name: Upload smoke, signing and builder diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ env.DIAGNOSTICS }}/
            ${{ env.OUT }}/builder-debug.yml
            ${{ env.OUT }}/builder-effective-config.yaml

  # Downloads each architecture separately, as the release orchestrator will,
  # and revalidates both against this checkout before exposing the outputs.
  verify:
    name: Verify macOS artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-names: '["macos-x64","macos-arm64"]'
      version: ${{ steps.summary.outputs.version }}
      source-sha: ${{ steps.summary.outputs.source-sha }}
      release-tag: ${{ env.RELEASE_TAG }}
      signing-status: ${{ steps.summary.outputs.signing-status }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: artifacts/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos-arm64
      - name: Verify both artifacts and their shared provenance
        id: summary
        run: |
          for target in macos-x64 macos-arm64; do
            node desktop/scripts/release-checks.mts assets "artifacts/$target" "$target"
          done
          read_info() { node -p "const [a, b] = ['x64', 'arm64'].map((arch) => require('./artifacts/macos-' + arch + '/$1')); if (a.$2 !== b.$2) throw new Error('$2 differs'); a.$2"; }
          {
            echo "version=$(read_info build-info.json version)"
            echo "source-sha=$(read_info build-info.json sourceSha)"
            echo "signing-status=$(read_info signing-info.json status)"
          } >> "$GITHUB_OUTPUT"
