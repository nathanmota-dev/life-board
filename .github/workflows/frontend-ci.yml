name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Audit, lint, typecheck and unit coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit
      - name: Dependency audit (critical blocks, lower severities reported)
        run: npm audit --workspace web --include-workspace-root --audit-level=critical
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint:frontend
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck:frontend
      - name: Unit tests with coverage
        if: ${{ !cancelled() }}
        run: npm run test:frontend:coverage
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          retention-days: 14
          if-no-files-found: warn
          path: web/coverage/
