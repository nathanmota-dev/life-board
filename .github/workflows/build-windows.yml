# Read-only native Windows build. Signing secrets are scoped to trusted tag packaging.
name: Build Windows

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      release:
        description: Require a stable tag, notes and valid production signatures
        type: boolean
        required: false
        default: false
    secrets:
      WIN_CSC_LINK:
        description: Base64-encoded Authenticode PFX (trusted release calls only)
        required: false
      WIN_CSC_KEY_PASSWORD:
        description: PFX password
        required: false
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
      version:
        value: ${{ jobs.build.outputs.version }}
      source-sha:
        value: ${{ jobs.build.outputs.source-sha }}
      target:
        value: ${{ jobs.build.outputs.target }}
      release-tag:
        value: ${{ jobs.build.outputs.release-tag }}
      signing-status:
        value: ${{ jobs.build.outputs.signing-status }}
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  RELEASE_TAG: ${{ inputs.release && github.event_name != 'workflow_dispatch' && github.ref_type == 'tag' && github.ref_name || '' }}
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Check, install and smoke Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact-name: windows-x64
      version: ${{ steps.provenance.outputs.version }}
      source-sha: ${{ steps.provenance.outputs.source-sha }}
      target: windows-x64
      release-tag: ${{ env.RELEASE_TAG }}
      signing-status: ${{ steps.provenance.outputs.signing-status }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify toolchain and record Windows image
        run: |
          node -e 'if (process.versions.node !== "24.18.0" || process.platform !== "win32" || process.arch !== "x64") process.exit(1)'
          if ([Environment]::OSVersion.Version.Build -ne 20348) { throw 'Expected Windows Server 2022 (20348)' }
          Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsVersion | Format-List
          "Windows image: $env:ImageOS $env:ImageVersion; Node $(node --version); source $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY

      - name: Validate smoke syntax with Windows PowerShell 5.1
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -Command {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'desktop/scripts/smoke-windows.ps1'), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate trusted release request
        if: inputs.release && github.event_name != 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:EVENT_NAME -ne 'push' -or $env:GITHUB_REF_TYPE -ne 'tag' -or $env:REPOSITORY -ne 'nathanmota-dev/life-board') { throw 'Release signing requires a trusted repository tag push' }
          # Tag validation uses yaml, so runs after npm ci below; no secrets are exposed here.

      - run: npm ci
      - name: Validate stable tag and notes
        if: env.RELEASE_TAG != ''
        run: |
          node desktop/scripts/release-checks.mts tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notes = "docs/release-notes/$($env:RELEASE_TAG.Substring(1)).md"
          if (!(Test-Path $notes) -or (Get-Item $notes).Length -eq 0) { throw 'Release notes are required' }
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage

      - name: Package unsigned build-only NSIS
        if: env.RELEASE_TAG == ''
        run: npm run package:win
      - name: Package signed production NSIS
        if: env.RELEASE_TAG != ''
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: |
          if (!$env:WIN_CSC_LINK -or !$env:WIN_CSC_KEY_PASSWORD -or !$env:WINDOWS_PUBLISHER_NAME) { throw 'Production signing requires WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD and WINDOWS_PUBLISHER_NAME' }
          npm run package:win -- --config.win.forceCodeSigning=true "--config.win.signtoolOptions.publisherName=$env:WINDOWS_PUBLISHER_NAME"

      - name: Install and smoke as a disposable standard user
        env:
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $options = @{ InstallerPath = "release/life-board-$version-win-x64.exe"; Version = $version; EvidenceDirectory = 'test-results/windows-smoke'; AsDisposableUser = $true }
          if ($env:RELEASE_TAG) { $options.RequireSignature = $true; $options.PublisherName = $env:WINDOWS_PUBLISHER_NAME }
          & desktop/scripts/smoke-windows.ps1 @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item test-results/windows-smoke/signing-info.json release/signing-info.json

      - name: Write provenance and checksums
        id: provenance
        run: |
          node desktop/scripts/release-checks.mts build-info release windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = Get-Content release/build-info.json -Raw | ConvertFrom-Json
          $signing = Get-Content release/signing-info.json -Raw | ConvertFrom-Json
          $names = @("life-board-$($info.version)-win-x64.exe", "life-board-$($info.version)-win-x64.exe.blockmap", 'latest.yml', 'build-info.json', 'signing-info.json')
          $lines = $names | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 -LiteralPath "release/$_").Hash.ToLowerInvariant())  $_" }
          [IO.File]::WriteAllText((Join-Path $PWD release/SHA256SUMS.txt), ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          "version=$($info.version)" >> $env:GITHUB_OUTPUT
          "source-sha=$($info.sourceSha)" >> $env:GITHUB_OUTPUT
          "signing-status=$($signing.status)" >> $env:GITHUB_OUTPUT
          "windows-x64: **$($signing.status)**; release tag: '$env:RELEASE_TAG'. Unsigned branch artifacts are for validation only." >> $env:GITHUB_STEP_SUMMARY
      - name: Verify feed, blockmap, signing evidence and provenance
        run: node desktop/scripts/release-checks.mts assets release windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/life-board-*-win-x64.exe
            release/life-board-*-win-x64.exe.blockmap
            release/latest.yml
            release/build-info.json
            release/signing-info.json
            release/SHA256SUMS.txt
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-smoke
          if-no-files-found: ignore
          retention-days: 14
          path: test-results/windows-smoke/
