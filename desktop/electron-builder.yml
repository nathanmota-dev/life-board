appId: dev.nathanmota.lifeboard
productName: Life Board
directories:
  output: release
  buildResources: desktop/resources
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: api/drizzle
    to: migrations
linux:
  target:
    - AppImage
    - deb
  artifactName: life-board-${version}-${arch}.${ext}
  category: Office
  icon: desktop/resources/icon.png
  syncDesktopName: true
  desktop:
    entry:
      Comment: Personal tasks, goals, calendar and habit tracking
      Keywords: habits;tasks;goals;calendar;
      StartupNotify: "true"
  synopsis: Personal control board for tasks, goals, calendar and habits
  description: >-
    Life Board organizes tasks, projects, calendar events, goals, habits and
    GitHub follow-ups in one desktop app. Data is stored locally.
win:
  target: nsis
  icon: desktop/resources/icon.ico
mac:
  target: dmg
  icon: desktop/resources/icon.icns

publish:
  provider: github
  owner: nathanmota-dev
  repo: life-board
  channel: latest
  releaseType: release
deb:
  # The APT package name differs from the Electron app name on purpose.
  packageName: life-board
  artifactName: life-board_${version}_${arch}.${ext}
  maintainer: nathanmota-dev <nathanmota-dev@users.noreply.github.com>
  priority: optional
  packageCategory: utils
  # Old names are provided by the t64 packages on Ubuntu 24.04+ and Debian 13.
  # libasound2 is also provided by an OSS shim, so prefer the real ALSA package.
  # pkexec became a separate package after policykit-1 was dropped.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - libgbm1
    - libasound2t64 | libasound2
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - pkexec | policykit-1
    - apt
  recommends:
    - libappindicator3-1 | libayatana-appindicator3-1
    - gnome-keyring | kwalletmanager | kwallet6
