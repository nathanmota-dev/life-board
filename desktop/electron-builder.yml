appId: dev.nathanmota.lifeboard
productName: Life Board
directories:
  output: release
  buildResources: desktop/resources
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: api/drizzle
    to: migrations
linux:
  target: AppImage
  category: Office
  icon: desktop/resources/icon.png
  syncDesktopName: true
win:
  target: nsis
  icon: desktop/resources/icon.ico
mac:
  target: dmg
  icon: desktop/resources/icon.icns
